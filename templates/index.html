<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance Tracking System</title>

    <!-- ✅ FIXED CSS LINK -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

    <h1>Attendance Tracking System</h1>

    <div class="quote">
        “A True Warrior Doesn't Need A Squad .”
    </div>

    <!-- EMPLOYEE ID -->
    <input type="text" id="emp_id" placeholder="Employee ID">

    <!-- ✅ LOAD BUTTON -->
    <button class="load-btn" onclick="loadEmployee()">
        🔍 Load
    </button>

    <!-- EMPLOYEE DETAILS -->
    <input type="text" id="name" placeholder="Employee Name" readonly>

    <input type="text" id="phone" placeholder="Phone Number" readonly>

    <input type="text" value="Chennai Office" readonly>

    <!-- Year_of_birth -->
    <input type="text" id="otp" placeholder="Year_of_birth">

    <!-- BUTTONS -->
    <div class="buttons">

        <button class="in-btn" onclick="markAttendance('in')">
            Punch IN
        </button>

        <button class="out-btn" onclick="markAttendance('out')">
            Punch OUT
        </button>

    </div>

    <!-- RESULT -->
    <div id="result">
        Waiting for Action...
    </div>

    <!-- FOOTER -->
    <div class="footer">
        Created By Ajith MIS
    </div>

</div>

<!-- ✅ FIXED JS LINK -->
<script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
